# Проверка приложения в PR в dev и master: форматирование, анализатор, тесты (ADR-017).
name: app-ci

# Запускаем проверку при создании или обновлении Pull Request в ветки dev и master
# (в master — релизы из dev и хотфиксы)
on:
  pull_request:
    branches: [dev, master]
    paths:
      - app/**
      - .gitea/workflows/app-ci.yaml
jobs:
  lint-and-test:
    # Используем образ, который поддерживает Flutter 3.41.x и заточен под CI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gmeligio/flutter-android:3.41.6
    
    # Указываем рабочую директорию, где лежит наш pubspec.yaml
    defaults:
      run:
        working-directory: app

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Зависимости
        # Получаем зависимости. В Gitea Actions (как и в GitHub) кэш pub не настроен,
        # но для маленького проекта это не критично.
        run: flutter pub get

      - name: Форматирование
        # Если кто-то забыл отформатировать код, шаг упадет (exit code 1).
        run: dart format --output=none --set-exit-if-changed .

      - name: Анализатор
        # Запускаем линтеры и статический анализ.
        # Если найдутся ошибки уровня error/warning, пайплайн остановится.
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        # Прогоняем юнит-тесты. Так как тестов пока нет, Flutter выдаст 
        # предупреждение, но не упадет с ошибкой (это безопасно).
        run: flutter test