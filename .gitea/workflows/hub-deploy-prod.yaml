# Выпуск Hub на prod по тегу hub/vX.Y.Z (ADR-014, ADR-017).
name: hub-deploy-prod

on:
  push:
    tags:
      - hub/v*

jobs:
  deploy:
    runs-on: deploy
    # Docker хоста и конфиг окружений нужны только деплою; задачам PR они не монтируются.
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /var/lib/himo-hub:/var/lib/himo-hub:ro
    env:
      IMAGE: git.hakoniwa.ru/tech/himo-hub
    steps:
      - uses: actions/checkout@v4

      - name: Версия из тега
        run: |
          version=${GITHUB_REF_NAME#hub/v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Тег $GITHUB_REF_NAME не в формате hub/vX.Y.Z" >&2
            exit 1
          fi
          echo "TAG=$version" >> "$GITHUB_ENV"

      - name: Вход в реестр
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.hakoniwa.ru -u "${{ vars.REGISTRY_USER }}" --password-stdin

      - name: Сборка и публикация образа
        run: |
          docker build -t "$IMAGE:$TAG" hub
          docker push "$IMAGE:$TAG"

      - name: Развёртывание
        run: deploy/deploy.sh prod "$TAG"
