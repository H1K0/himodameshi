# Pre-commit hooks: run locally on every `git commit`.
# What they do and how to install — see CONTRIBUTING.md, section on pre-commit.
repos:
  # Blocks commits that contain secrets: API keys, tokens, passwords
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Validates YAML syntax: CI workflows, docker-compose, OpenAPI, pubspec
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
